version: '3.8'

services:
  backend:
    build: ./backend
    container_name: delivery-backend
    ports:
      - "3000:3000" 
    volumes:
      - ./backend/src/data:/app/src/data
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: delivery-frontend
    ports:
      - "8080:80" 
    volumes:
      - ./frontend:/usr/share/nginx/html 
    depends_on:
      - backend
    restart: unless-stopped